# Chay: VLLM_TAG=<tag ban da test> docker compose up
# Nen ghim tag cu the (vd v0.17.0), khong dung latest.
services:
  vllm-server:
    image: vllm/vllm-openai:${VLLM_TAG:-latest}
    container_name: datamate_vllm_server
    # Ghi de entrypoint de `command` luon la tham so cua `vllm serve`,
    # bat ke image co san entrypoint hay khong.
    entrypoint: ["vllm", "serve"]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./models:/workspace/models
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command: >
      /workspace/models/Qwen3.5-9B
      --host 0.0.0.0
      --port 8000
      --dtype bfloat16
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --seed 0
      --served-model-name qwen3.5-9b
